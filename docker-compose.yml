services:
  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:16
    container_name: mlflow-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - mlops-network

  # ============================================================
  # MinIO
  # ============================================================

  minio:
    image: minio/minio:latest
    container_name: mlflow-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9010:9000"
      - "9011:9001"

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - mlops-network

  # ============================================================
  # Create MLflow artifact bucket
  # ============================================================

  minio-create-bucket:
    image: minio/mc:latest
    container_name: minio-init

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000
      ${MINIO_ROOT_USER}
      ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing minio/mlflow-artifacts;
      exit 0;
      "

    networks:
      - mlops-network

  # ============================================================
  # MLflow Tracking Server
  # ============================================================

  mlflow:
    build:
      context: ./mlflow

    container_name: mlflow-server

    depends_on:
      postgres:
        condition: service_healthy

      minio:
        condition: service_healthy

      minio-create-bucket:
        condition: service_completed_successfully

    ports:
      - "5000:5000"

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}

    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/version')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - mlops-network

  # ============================================================
  # FastAPI
  # ============================================================

  fastapi:
    build:
      context: .

    container_name: breast-cancer-api

    depends_on:
      mlflow:
        condition: service_healthy

    ports:
      - "8001:8000"
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}

      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}

      MODEL_NAME: ${MODEL_NAME}
      MODEL_ALIAS: ${MODEL_ALIAS}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}

      API_PREFIX: ${API_PREFIX}
      LOG_LEVEL: ${LOG_LEVEL}

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - mlops-network

  # ============================================================
  # Prometheus
  # ============================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      fastapi:
        condition: service_healthy

    networks:
      - mlops-network

  # ============================================================
  # Grafana
  # ============================================================

  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    depends_on:
      prometheus:
        condition: service_started

    volumes:
      - grafana-data:/var/lib/grafana

    networks:
      - mlops-network

# ============================================================
# Volumes
# ============================================================

volumes:
  postgres-data:

  minio-data:

  grafana-data:

# ============================================================
# Network
# ============================================================

networks:
  mlops-network:
    driver: bridge
